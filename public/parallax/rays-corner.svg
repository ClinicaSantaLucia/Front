<line x1="0" y1="0" x2="800" y2="200" />
<line x1="0" y1="0" x2="800" y2="240" />
<line x1="0" y1="0" x2="800" y2="280" />
<line x1="0" y1="0" x2="800" y2="320" />
<line x1="0" y1="0" x2="800" y2="360" />
<line x1="0" y1="0" x2="800" y2="400" />
<line x1="0" y1="0" x2="800" y2="440" />
<line x1="0" y1="0" x2="800" y2="480" />
<line x1="0" y1="0" x2="800" y2="520" />
<line x1="0" y1="0" x2="800" y2="560" />
